<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - PsyBear Secure Vault</title>

</head>

<body style="text-align: center;">

    <img src="{{ url_for('static', filename='psybear-black-hoody.png') }}"
         alt="PsyBear Security Logo"
         style="display: block; margin: 20px auto; width: 180px;">

    <h1>Login</h1>

    <form method="POST" action="/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="username">Username:</label>

        <input type="text"
               id="username"
               name="username"
               required>

        <br><br>

        <label for="password">Password:</label>

        <input type="password"
               id="password"
               name="password"
               required>

        <br><br>

        <button type="submit">Login</button>

    </form>

    <p>
        <a href="/">Back to Home</a>
    </p>

</body>

</html>
